<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>速记</title>
  <link rel="icon" type="image/png" href="/static/img/icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=DotGothic16&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/float.css" />
  <script>
    try {
      var t = localStorage.getItem("phrasemate-theme");
      if (t === "warm" || t === "beige") document.documentElement.setAttribute("data-theme", "warm");
      else if (t === "pixel" || t === "cute" || t === "kawaii") document.documentElement.setAttribute("data-theme", "pixel");
      else if (t === "tech" || t === "neon" || t === "cyber" || t === "future") document.documentElement.setAttribute("data-theme", "tech");
    } catch (e) {}
  </script>
</head>
<body>
  <div class="shell" id="dragArea">
    <img class="badge" src="/static/img/icon.png" width="36" height="36" alt="" title="拖动" />
    <input
      id="term"
      type="text"
      placeholder="生词 / 短语，回车收录"
      autocomplete="off"
      spellcheck="false"
    />
      <button type="button" class="icon" id="btnNotebook" title="显示 / 隐藏生词本">本</button>
  </div>
  <div class="toast" id="toast" hidden></div>
  <script src="/static/js/float.js"></script>
</body>
</html>
