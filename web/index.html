<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, max-scale=1" />
  <title>PhraseMate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Syne:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body class="app-shell">
  <div class="ambient" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">Pm</span>
      <div>
        <h1>PhraseMate</h1>
        <p class="tagline">本地英语生词本 · AI 双语释义</p>
      </div>
    </div>
    <div class="topbar-actions">
      <button type="button" class="btn ghost" id="btnShowFloat" title="显示系统置顶速记窗">显示速记窗</button>
      <button type="button" class="btn ghost" id="btnSettings" title="API 与模型设置">设置</button>
      <button type="button" class="status-pill" id="statusPill" title="点击打开设置">检测中…</button>
    </div>
  </header>

  <!-- Notebook home -->
  <main class="page page-notebook" id="pageNotebook">
    <section class="panel notebook">
      <div class="panel-head">
        <div class="head-left">
          <h2>生词本</h2>
          <span class="count" id="wordCount">0</span>
        </div>
        <button type="button" class="btn" id="btnGoQuiz">英语自测</button>
      </div>
      <div class="search-row">
        <input type="search" id="filterInput" placeholder="筛选生词…" autocomplete="off" />
      </div>
      <div class="notebook-layout">
        <div class="word-list" id="wordList">
          <p class="empty">还没有生词。用右下角置顶速记条输入，回车即可立刻收录。</p>
        </div>
        <aside class="word-detail" id="wordDetail">
          <p class="empty">点击左侧单词查看释义</p>
        </aside>
      </div>
    </section>
    <p class="dock-hint">右下角置顶速记条：回车立刻入库。关闭本窗口会隐藏到后台；退出请用托盘菜单。</p>
  </main>

  <!-- Quiz page -->
  <main class="page page-quiz" id="pageQuiz" hidden>
    <section class="panel quiz-panel">
      <div class="panel-head">
        <div class="head-left">
          <button type="button" class="btn ghost" id="btnBackNotebook">← 返回生词本</button>
          <h2>English Quiz</h2>
        </div>
        <button type="button" class="btn ghost" id="btnNewQuiz">Generate</button>
      </div>
      <p class="quiz-lead">All questions and choices are in English.</p>
      <div id="quizArea">
        <p class="empty">Click Generate to start a short quiz from your notebook.</p>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" hidden></div>

  <div class="modal-backdrop" id="settingsModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="modal-head">
        <h2 id="settingsTitle">API 设置</h2>
        <button type="button" class="icon-btn modal-close" id="btnCloseSettings" aria-label="关闭">×</button>
      </div>
      <p class="modal-lead">在界面填写即可，无需编辑 .env。配置保存在本地数据库，立即生效。</p>
      <form id="settingsForm" class="settings-form">
        <label class="field">
          <span>API Key</span>
          <input type="password" id="settingsApiKey" name="api_key" autocomplete="off" placeholder="sk-…" />
          <span class="field-hint" id="settingsKeyHint">留空则保持已保存的 Key 不变</span>
        </label>
        <label class="field">
          <span>Base URL</span>
          <input type="url" id="settingsBaseURL" name="base_url" autocomplete="off" placeholder="https://api.openai.com/v1" />
        </label>
        <label class="field">
          <span>模型</span>
          <input type="text" id="settingsModel" name="model" autocomplete="off" placeholder="gpt-4o-mini" />
        </label>
        <p class="settings-presets">
          快捷填充：
          <button type="button" class="linkish" data-preset="openai">OpenAI</button>
          ·
          <button type="button" class="linkish" data-preset="deepseek">DeepSeek</button>
        </p>
        <div class="modal-actions">
          <button type="button" class="btn ghost" id="btnClearKey">清除 Key</button>
          <button type="submit" class="btn" id="btnSaveSettings">保存</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
