name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "PHRASEMATE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "ZIP_NAME=PhraseMate-macos-${GITHUB_REF_NAME#v}.zip" >> "$GITHUB_ENV"
          else
            echo "PHRASEMATE_VERSION=0.0.0" >> "$GITHUB_ENV"
            echo "ZIP_NAME=PhraseMate-macos.zip" >> "$GITHUB_ENV"
          fi
          echo "PHRASEMATE_BUILD=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Show toolchain
        run: |
          go version
          clang --version
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)"
          uname -m

      - name: Build arm64
        env:
          CGO_ENABLED: "1"
          GOOS: darwin
          GOARCH: arm64
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/PhraseMate-arm64 .

      - name: Build amd64
        env:
          CGO_ENABLED: "1"
          GOOS: darwin
          GOARCH: amd64
        run: |
          SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          export SDKROOT
          export CGO_CFLAGS="-isysroot $SDKROOT -arch x86_64"
          export CGO_LDFLAGS="-isysroot $SDKROOT -arch x86_64"
          go build -trimpath -ldflags="-s -w" -o dist/PhraseMate-amd64 .

      - name: Create universal binary
        run: |
          lipo -create -output dist/PhraseMate dist/PhraseMate-arm64 dist/PhraseMate-amd64
          chmod +x dist/PhraseMate
          lipo -info dist/PhraseMate
          file dist/PhraseMate

      - name: Pack PhraseMate.app
        run: |
          ./dist/PhraseMate --pack-app dist/PhraseMate.app
          codesign --force --deep --sign - dist/PhraseMate.app
          codesign -dv --verbose=2 dist/PhraseMate.app
          file dist/PhraseMate.app/Contents/MacOS/PhraseMate
          lipo -info dist/PhraseMate.app/Contents/MacOS/PhraseMate

      - name: Zip app bundle
        run: |
          ditto -c -k --keepParent dist/PhraseMate.app "dist/${ZIP_NAME}"
          ls -lh "dist/${ZIP_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhraseMate-macos
          path: dist/${{ env.ZIP_NAME }}
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "EXE_NAME=PhraseMate-windows-${GITHUB_REF_NAME#v}.exe" >> "$GITHUB_ENV"
          else
            echo "EXE_NAME=PhraseMate.exe" >> "$GITHUB_ENV"
          fi

      - name: Show toolchain
        run: |
          go version
          go env GOOS GOARCH CGO_ENABLED

      - name: Build exe
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -trimpath -ldflags="-H windowsgui -s -w" -o "dist/${{ env.EXE_NAME }}" .
          Get-Item "dist/${{ env.EXE_NAME }}" | Format-List Name, Length, LastWriteTime

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhraseMate-windows
          path: dist/${{ env.EXE_NAME }}
          if-no-files-found: error

  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t phrasemate:latest .

      - name: Smoke test
        run: |
          docker run -d --name phrasemate-test -p 8080:8080 phrasemate:latest
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/api/status; then
              echo
              docker logs phrasemate-test
              docker stop phrasemate-test
              exit 0
            fi
            sleep 1
          done
          docker logs phrasemate-test
          exit 1

      - name: Save image
        run: |
          mkdir -p dist
          docker save phrasemate:latest | gzip > dist/phrasemate-docker.tar.gz
          ls -lh dist/phrasemate-docker.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhraseMate-docker
          path: dist/phrasemate-docker.tar.gz
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [macos, windows, docker]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: PhraseMate-*
          path: dist
          merge-multiple: true

      - name: List files
        run: ls -lh dist

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
